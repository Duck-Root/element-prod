# Vhost Nginx pour un domaine unique, sans Tailscale.
# Charger dans le contexte http (par exemple /etc/nginx/conf.d/matrix.conf).
# Hypothèse : Nginx et les cinq services amont partagent le même réseau Docker.
# À remplacer partout : nomdedomaine.fr et les deux IP d'administration ci-dessous.
# Monter le certificat et sa clé dans /tls/server.crt et /tls/server.key.

map $http_upgrade $matrix_connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name nomdedomaine.fr;

    # Ce vhost suppose un certificat déjà émis (par exemple via DNS-01).
    # Il ne fournit pas de webroot pour le challenge ACME HTTP-01.
    return 301 https://nomdedomaine.fr$request_uri;
}

server {
    listen 443 ssl;
    server_name nomdedomaine.fr;
    server_tokens off;

    ssl_certificate     /tls/server.crt;
    ssl_certificate_key /tls/server.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:MatrixTLS:10m;
    ssl_session_timeout 1d;

    client_max_body_size 100m;

    access_log /var/log/nginx/access.log;
    error_log  /var/log/nginx/error.log warn;

    proxy_http_version 1.1;
    proxy_connect_timeout 10s;
    proxy_read_timeout 600s;
    proxy_send_timeout 600s;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    # Nginx est ici le premier proxy joignable depuis Internet.
    # Remplacer, et non accepter, un X-Forwarded-For fourni par le client.
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $matrix_connection_upgrade;

    # Découverte : convient à une installation neuve dont le server_name
    # est nomdedomaine.fr. Ne pas renommer l'identité d'une base existante.
    location = /.well-known/matrix/server {
        default_type application/json;
        return 200 '{"m.server":"nomdedomaine.fr:443"}';
    }

    location = /.well-known/matrix/client {
        default_type application/json;
        add_header Access-Control-Allow-Origin "*" always;
        return 200 '{"m.homeserver":{"base_url":"https://nomdedomaine.fr"},"org.matrix.msc4143.rtc_foci":[{"type":"livekit","livekit_service_url":"https://nomdedomaine.fr/livekit/jwt"}]}';
    }

    # Exception OpenID nécessaire aux appels ; ne pas journaliser ses jetons.
    location = /_matrix/federation/v1/openid/userinfo {
        access_log off;
        proxy_pass http://synapse:8008;
    }

    # API publique : conserver intégralement les chemins Matrix/Synapse.
    location ^~ /_matrix/client/ {
        proxy_pass http://synapse:8008;
    }

    location ^~ /_matrix/media/ {
        proxy_pass http://synapse:8008;
    }

    location ^~ /_synapse/client/ {
        proxy_pass http://synapse:8008;
    }

    # ADMINISTRATION : IP publiques de SORTIE du VPN et des bureaux.
    # Ces deux adresses sont des EXEMPLES réservés à la documentation.
    # Les remplacer aux DEUX endroits, ici et dans /admin/.
    location ^~ /_synapse/admin/ {
        allow 198.51.100.10/32; # À REMPLACER : IP publique de sortie du VPN pro
        allow 203.0.113.20/32;  # À REMPLACER : IP publique des bureaux
        deny all;

        proxy_pass http://synapse:8008;
    }

    # Bloquer les autres routes internes et la fédération générale.
    location = /_matrix { return 404; }
    location /_matrix/ { return 404; }
    location = /_synapse { return 404; }
    location /_synapse/ { return 404; }

    # JWT : /livekit/jwt/sfu/get devient /sfu/get sur le service JWT.
    location /livekit/jwt/ {
        proxy_pass http://jwt:8080/;
    }

    # LiveKit : supprimer le préfixe public avant de joindre le backend.
    # Gérer aussi l'URL sans slash final pour la connexion WebSocket.
    location = /livekit/sfu {
        proxy_pass http://livekit:7880/;
    }

    location /livekit/sfu/ {
        proxy_pass http://livekit:7880/;
    }

    # Le redirect ne livre aucun contenu d'administration.
    location = /admin {
        return 308 /admin/;
    }

    # Ketesa doit être construit pour le chemin /admin.
    location ^~ /admin/ {
        allow 198.51.100.10/32; # À REMPLACER : IP publique de sortie du VPN pro
        allow 203.0.113.20/32;  # À REMPLACER : IP publique des bureaux
        deny all;

        # L'application est servie à la racine du conteneur ; ses URL
        # publiques sont construites pour /admin. Retirer donc le préfixe.
        proxy_pass http://ketesa:8080/;
    }

    # Interface de messagerie Element, à la racine du domaine.
    location / {
        proxy_pass http://element:80;
    }
}
