# Coexistence : autres services en TCP 3306, 5100, 8090 et 8443.
# Aucun de ces ports n'est publié par ce Compose ; voir RESERVED_TCP_PORTS dans .env.
# Nginx hôte partage 80/443 via ses vhosts. Les backends HTTP restent sur 127.0.0.1.
name: ${COMPOSE_PROJECT_NAME:-matric-poc-prod}
x-common: &common
  restart: unless-stopped
  networks: [matrix]
  logging:
    driver: json-file
    options: {max-size: 10m, max-file: '3'}
services:
  postgres:
    <<: *common
    image: ${POSTGRES_IMAGE}
    environment:
      POSTGRES_DB: synapse
      POSTGRES_USER: synapse
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run python3 scripts/render.py}
      POSTGRES_INITDB_ARGS: --encoding=UTF8 --locale=C
    volumes: [./data/postgres:/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U synapse -d synapse']
      interval: 10s
      timeout: 5s
      retries: 12
  synapse:
    <<: *common
    image: ${SYNAPSE_IMAGE}
    ports: ["127.0.0.1:${SYNAPSE_HTTP_PORT:-18008}:8008/tcp"]
    environment:
      SYNAPSE_CONFIG_PATH: /config/homeserver.yaml
      UID: '991'
      GID: '991'
    volumes:
      - ./configs/generated/synapse:/config:ro
      - ./data/synapse:/data
    depends_on:
      postgres: {condition: service_healthy}
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://localhost:8008/health', timeout=5)"]
      interval: 15s
      timeout: 10s
      retries: 20
  element:
    <<: *common
    image: ${ELEMENT_IMAGE}
    ports: ["127.0.0.1:${ELEMENT_HTTP_PORT:-18080}:80/tcp"]
    volumes:
      - ./configs/generated/element/config.json:/app/config.json:ro
      - ./configs/element/default.conf.template:/etc/nginx/templates/default.conf.template:ro
  jwt:
    <<: *common
    image: ${JWT_IMAGE}
    ports: ["127.0.0.1:${JWT_HTTP_PORT:-18081}:8080/tcp"]
    extra_hosts: ["${MATRIX_DOMAIN}:host-gateway"]
    env_file: ./configs/generated/jwt.env
    environment:
      SSL_CERT_FILE: /tls/ca.crt
    volumes:
      - ./data/tls/ca.crt:/tls/ca.crt:ro
      - ./configs/generated/synapse/rtc-registration.yaml:/registration.yaml:ro
    depends_on:
      synapse: {condition: service_healthy}
      livekit: {condition: service_started}
  livekit:
    <<: *common
    image: ${LIVEKIT_IMAGE}
    command: [--config, /etc/livekit.yaml]
    volumes: [./configs/generated/livekit/livekit.yaml:/etc/livekit.yaml:ro]
    ports:
      - '127.0.0.1:${LIVEKIT_HTTP_PORT:-17880}:7880/tcp'
      - '${BIND_IP}:${LIVEKIT_TCP_PORT}:${LIVEKIT_TCP_PORT}/tcp'
      - '${BIND_IP}:${LIVEKIT_UDP_START}-${LIVEKIT_UDP_END}:${LIVEKIT_UDP_START}-${LIVEKIT_UDP_END}/udp'
  coturn:
    <<: *common
    image: ${COTURN_IMAGE}
    command: [-c, /etc/turnserver.conf]
    volumes:
      - ./configs/generated/coturn/turnserver.conf:/etc/turnserver.conf:ro
      - ./data/tls:/tls:ro
    ports:
      - '${BIND_IP}:${TURN_PORT}:${TURN_PORT}/udp'
      - '${BIND_IP}:${TURN_PORT}:${TURN_PORT}/tcp'
      - '${BIND_IP}:${TURN_TLS_PORT}:${TURN_TLS_PORT}/tcp'
      - '${BIND_IP}:${TURN_UDP_START}-${TURN_UDP_END}:${TURN_UDP_START}-${TURN_UDP_END}/udp'
  ketesa:
    <<: *common
    image: ${KETESA_IMAGE:-ghcr.io/etkecc/ketesa:v1.5.1-subpath-admin}
    environment:
      SERVER_HOST: 0.0.0.0
    volumes:
      - ./configs/generated/ketesa/config.json:/var/public/admin/config.json:ro
    ports: ["127.0.0.1:${KETESA_HTTP_PORT:-18082}:8080/tcp"]
    healthcheck:
      test: [CMD, wget, --no-verbose, --tries=1, --spider, 'http://127.0.0.1:8080/health']
      interval: 30s
      timeout: 10s
      retries: 3

networks:
  matrix:
    driver: bridge
